<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HGhub · 短剧</title>
<meta name="description" content="HGhub 短剧：竖屏 feed、自动播放、分类 / 榜单 / 搜索、评论与分享。">
<meta name="theme-color" content="#0e0e11">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="HGhub · 短剧">
<meta property="og:description" content="竖屏短剧 feed · 自动播放 · 分类榜单搜索">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<link rel="preload" href="/hls.min.js" as="script">
<script src="/hls.min.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body data-view="home">

<header class="topbar">
  <button type="button" class="logo" id="btnHome" title="返回首页" aria-label="HGhub 首页">HG<b>hub</b></button>
  <form class="search" id="searchForm" role="search">
    <input id="q" type="search" placeholder="搜索短剧、作者、标签…" enterkeyhint="search"
           aria-label="搜索关键词" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit" id="btnSearch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5L16.5 16.5"/></svg>
      <span>搜索</span>
    </button>
  </form>
</header>

<main>
  <section id="view-home" class="view">
    <div id="newBanner" class="newbanner" role="status" hidden></div>
    <div class="feed" id="feed"><div class="empty">加载中…</div></div>
  </section>

  <section id="view-cat" class="view" hidden>
    <div class="chips" id="catChips"><span class="hint">加载分类中…</span></div>
    <p class="hint" id="catTotal"></p>
    <div class="grid" id="catGrid"></div>
    <div id="catEnd" class="empty" hidden>已加载全部</div>
  </section>

  <section id="view-rank" class="view" hidden>
    <div class="chips" id="rankTabs">
      <button type="button" class="chip on" data-type="hot">热播榜</button>
      <button type="button" class="chip" data-type="recommend">推荐榜</button>
      <button type="button" class="chip" data-type="potential">飙升榜</button>
    </div>
    <div id="rankList"><div class="empty">加载中…</div></div>
    <p class="hint">榜单每日更新，上游接口只返回前 20 名，无法翻页</p>
  </section>

  <section id="view-me" class="view" hidden>
    <div id="meBox"></div>
  </section>

  <section id="view-search" class="view" hidden>
    <div class="chips" id="hotTags"></div>
    <p class="hint" id="searchTotal"></p>
    <div class="grid" id="searchGrid"></div>
    <div id="searchEnd" class="empty" hidden>已加载全部</div>
    <div id="searchEmpty" class="empty" hidden>未找到相关内容，换个关键词试试</div>
  </section>
</main>

<nav class="bottomnav" id="bottomNav" aria-label="主导航">
  <button type="button" data-view="home" class="on" aria-current="page">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1H10v-5.5h4V21h3.5a1 1 0 0 0 1-1V9.5"/></svg></span>首页
  </button>
  <button type="button" data-view="cat">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>分类
  </button>
  <button type="button" data-view="rank">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 5.5H4.8a2.7 2.7 0 0 0 2.7 4.6"/><path d="M17 5.5h2.2a2.7 2.7 0 0 1-2.7 4.6"/><path d="M12 14v3.5"/><path d="M8.5 20.5h7"/></svg></span>榜单
  </button>
  <button type="button" data-view="me">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.8"/><path d="M4.8 20.5a7.2 7.2 0 0 1 14.4 0"/></svg></span>我的
  </button>
</nav>

<footer id="appFooter">HGhub · 短剧 · 复刻版</footer>

<!-- 详情 / 播放弹窗 -->
<div class="modal" id="player" role="dialog" aria-modal="true" aria-label="剧集详情" hidden>
  <div class="box">
    <button class="close" id="btnClosePlayer" type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div id="detailPane">
      <button class="btn ghost backlink detailback" id="btnBackFeed" type="button">‹ 返回</button>
      <div class="detail-cover" id="dCover">
        <img id="dCoverImg" alt="">
        <div class="detail-rail">
          <div class="act">
            <button type="button" id="dRailComment" aria-label="查看评论">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </button>
            <span id="dRailCommentN"></span>
          </div>
          <div class="act">
            <button type="button" id="dRailFav" aria-label="收藏">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.6l-5.8 3.1 1.1-6.5L2.6 9.6l6.5-.9L12 2.8z"/></svg>
            </button>
            <span id="dRailFavN"></span>
          </div>
          <div class="act">
            <button type="button" id="dRailShare" aria-label="分享">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
            </button>
          </div>
        </div>
      </div>

      <h2 id="pTitle"></h2>
      <p class="hint" id="pMeta"></p>
      <div class="detail-stats" id="dStats"></div>
      <p class="desc clamped" id="pDesc"></p>
      <button class="btn ghost" id="btnMoreDesc" type="button">展开介绍</button>
      <div class="detail-tags" id="dTags"></div>

      <div class="rowbtns">
        <button class="btn ghost" id="btnDFav" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.6l-5.8 3.1 1.1-6.5L2.6 9.6l6.5-.9L12 2.8z"/></svg>
          <span id="btnDFavText">收藏</span>
        </button>
        <button class="btn ghost" id="btnDShare" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
          分享
        </button>
        <button class="btn ghost" id="btnDComment" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          评论
        </button>
      </div>

      <button class="btn detail-play watchall" id="btnPlayDetail" type="button">▶ 看全集</button>

      <h3 class="sec-title">选集 <span class="hint" id="dEpTotal"></span></h3>
      <div class="ep-range" id="dEpRanges"></div>
      <div class="eps" id="pEps"></div>
    </div>

    <div id="playerPane" hidden>
      <div class="playerhead">
        <button class="btn ghost backlink" id="btnBackDetail" type="button">‹ 返回详情</button>
        <span class="hint" id="epLabel"></span>
      </div>
      <video id="video" controls playsinline preload="metadata" aria-label="播放器"></video>
      <p class="playerstatus" id="playerStatus" role="status" hidden></p>
      <div class="ctl">
        <select id="speedSel" title="倍速" aria-label="播放倍速">
          <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
          <option value="1" selected>1x</option><option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option><option value="2">2x</option>
        </select>
        <select id="streamSel" title="线路画质" aria-label="线路画质">
          <option value="main" selected>主线</option><option value="hevc">高清 HEVC</option><option value="preview">预览</option>
        </select>
        <button class="btn ghost" id="btnFav" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.6l-5.8 3.1 1.1-6.5L2.6 9.6l6.5-.9L12 2.8z"/></svg>
          <span id="btnFavText">收藏</span>
        </button>
        <button class="btn ghost" id="btnShare" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
          分享
        </button>
        <button class="btn ghost" id="btnPrevEp" type="button">上一集</button>
        <button class="btn ghost" id="btnNextEp" type="button">下一集</button>
      </div>
    </div>
  </div>
</div>

<!-- 评论面板 -->
<div class="sheet" id="commentSheet" role="dialog" aria-modal="true" aria-label="评论" hidden>
  <div class="sheet-head">
    <h3 id="commentTitle">评论</h3>
    <button class="close" id="btnCloseComments" type="button" aria-label="关闭评论">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="commentList"><div class="empty">加载评论中…</div></div>
  <div class="commentbar">
    <input id="commentInput" type="text" placeholder="发一条友善的评论…" enterkeyhint="send" aria-label="评论内容" maxlength="200">
    <button class="btn" id="btnSendComment" type="button">发送</button>
  </div>
</div>

<!-- 分享面板 -->
<div class="sheet" id="shareSheet" role="dialog" aria-modal="true" aria-label="分享" hidden>
  <div class="sheet-head">
    <h3 id="shareTitle">分享</h3>
    <button class="close" id="btnCloseShare" type="button" aria-label="关闭分享">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sharelink" id="shareLink"></div>
  <div class="sharegrid">
    <button id="btnCopyLink" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13.5a5 5 0 0 0 7.5.5l2.5-2.5a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 10.5a5 5 0 0 0-7.5-.5L4 12.5a5 5 0 0 0 7 7l1.5-1.5"/></svg></span>复制链接</button>
    <button id="btnShareWechat" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>微信</button>
    <button id="btnShareQQ" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="13" rx="3.5"/><circle cx="8.5" cy="11" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="11" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="11" r="1.1" fill="currentColor" stroke="none"/></svg></span>QQ</button>
    <button id="btnSysShare" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg></span>系统分享</button>
  </div>
  <button class="btn" id="btnDownloadApp" type="button" style="width:100%">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="M6.5 9.5L12 15l5.5-5.5"/><path d="M4 20.5h16"/></svg>
    下载 App
  </button>
  <p class="hint" style="margin-top:8px">别人点开分享链接，会直接打开对应剧集开始播。</p>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<noscript><p class="empty">需要开启 JavaScript 才能使用。</p></noscript>
</body>
</html>
